<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 650px; margin: 0 auto; }
        a, button { text-decoration: none; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; display: inline-block; }
        .btn-green { background: #2e7d32; color: white; }
        .btn-blue { background: #1565c0; color: white; }
        .btn-red { background: #c62828; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        form p { margin-bottom: 15px; }
form label { display: block; font-weight: 600; margin-bottom: 5px; }
form input[type="text"],
form input[type="date"],
form select,
form textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
}
form input:focus, form select:focus, form textarea:focus {
    outline: none;
    border-color: #1565c0;
}
form input[type="checkbox"] { width: auto; }
    </style>
</head>
<body>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
