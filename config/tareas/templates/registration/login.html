{% extends 'tareas/base.html' %}

{% block content %}
<h2>Iniciar Sesión</h2>

{% if form.errors %}
<p style="color: red;">Usuario o contraseña incorrectos. Por favor, intentá de nuevo.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <p>
        <label for="id_username">Usuario:</label><br>
        {{ form.username }}
    </p>
    <p>
        <label for="id_password">Contraseña:</label><br>
        {{ form.password }}
    </p>
    <button type="submit" class="btn-green">Ingresar</button>
</form>
{% endblock %}
